<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo-APP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <h1>ToDo-APP</h1>
        </nav>
    </header>

    <main>
        <!-- Formulario para añadir nuevas tareas -->
        <form action="{{ url_for('home') }}" class="input_container" method="POST">
            <input type="text" placeholder="Add a new task" id="input_todo" name="todo_name" required>
            <select name="priority" id="priority" required>
                <option value="1">Alta</option>
                <option value="2">Media</option>
                <option value="3" selected>Baja</option>
            </select>
            <button type="submit" id="add_todo" title="Add task">+</button>
        </form>

        <!-- Título de la lista de tareas -->
        <h2>Your Task List</h2>

        <!-- Contenedor de tareas -->
        <div class="todo_container">
            {% for item in items %}
            <div class="todo">
                <!-- Mostrar tarea (solo en modo de visualización) -->
                <div class="task-display" id="task-display-{{ item.id }}" {% if item.id == editing_task_id %}style="display:none;"{% endif %}>
                    <!-- Marcar tarea como completada -->
                    <form action="{{ url_for('checked_todo', todo_id=item.id) }}" method="POST">
                        <span class="checkmark-container">
                            <input type="checkbox" id="check-{{ item.id }}" {% if item.checked %}checked{% endif %} onchange="this.form.submit()">
                            <label for="check-{{ item.id }}" class="checkmark"></label>
                        </span>
                    </form>

                    <p>{{ item.name }}</p>
                    <span class="priority-label">
                        {% if item.priority == '1' %}
                            <span class="priority high">Alta</span>
                        {% elif item.priority == '2' %}
                            <span class="priority medium">Media</span>
                        {% else %}
                            <span class="priority low">Baja</span>
                        {% endif %}
                    </span>

                    <button onclick="editTask('{{ item.id }}')">Edit</button>
                    <form action="{{ url_for('delete_todo', todo_id=item.id) }}" method="POST">
                        <button class="delete-button" title="Delete task">Delete</button>
                    </form>
                </div>

                <!-- Formulario de edición (solo visible al editar la tarea) -->
                <div class="task-edit" id="task-edit-{{ item.id }}" {% if item.id != editing_task_id %}style="display:none;"{% endif %}>
                    <form action="{{ url_for('edit_todo', todo_id=item.id) }}" method="POST">
                        <!-- Editar nombre -->
                        <input type="text" name="new_text" value="{{ item.name }}" required>

                        <!-- Editar prioridad -->
                        <select name="priority" required>
                            <option value="1" {% if item.priority == '1' %}selected{% endif %}>Alta</option>
                            <option value="2" {% if item.priority == '2' %}selected{% endif %}>Media</option>
                            <option value="3" {% if item.priority == '3' %}selected{% endif %}>Baja</option>
                        </select>

                        <button type="submit">Save</button>
                        <button type="button" onclick="cancelEdit()">Cancel</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <script>
        var editing_task_id = null;

        // Función para mostrar el formulario de edición de la tarea
        function editTask(taskId) {
            editing_task_id = taskId;

            // Ocultar la vista normal de la tarea
            document.getElementById('task-display-' + taskId).style.display = 'none';

            // Mostrar el formulario de edición
            document.getElementById('task-edit-' + taskId).style.display = 'block';
        }

        // Función para cancelar la edición y volver a la vista normal
        function cancelEdit() {
            editing_task_id = null;

            // Mostrar la vista normal de todas las tareas
            document.querySelectorAll('.task-display').forEach(function(task) {
                task.style.display = 'block';
            });

            // Ocultar los formularios de edición de todas las tareas
            document.querySelectorAll('.task-edit').forEach(function(task) {
                task.style.display = 'none';
            });
        }
    </script>
</body>
</html>
