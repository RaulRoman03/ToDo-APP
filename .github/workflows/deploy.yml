name: Deploy to Render

on:
  push:
    branches:
      - main  # O la rama que prefieras

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'  # Cambia la versión según tu requerimiento

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Asegúrate de tener un requirements.txt en tu repo

      - name: Load environment variables from variables.env
        run: |
          set -o allexport
          source variables.env
          set +o allexport

      - name: Deploy to Render
        run: |
          curl -X POST https://api.render.com/deploy/sync \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -d '{"serviceId":"$RENDER_SERVICE_ID"}'