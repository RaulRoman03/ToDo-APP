# Project Information
site_name: ToDo-APP Documentation
site_description: Official documentation for the Flask-based ToDo-APP
site_author: José Raúl Román Ramírez
docs_dir: docs

# Repository
repo_name: RaulRoman03/ToDo-APP
repo_url: https://github.com/RaulRoman03/ToDo-APP
edit_uri: edit/main/docs/

# Configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: deep-orange
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-orange
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Extensions
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# Navigation
nav:
  - Home: index.md
  - Installation: installation.md
  - Getting Started:
    - Overview: getting_started/overview.md
    - Configuration: getting_started/configuration.md
  - Features:
    - User Management: features/user_management.md
    - Task Management: features/task_management.md
  - API Reference:
    - Authentication API: api/authentication.md
    - Tasks API: api/tasks.md
  - Testing:
    - Unit Tests: testing/unit.md
    - Integration Tests: testing/integration.md
    - End-to-End Tests: testing/e2e.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md